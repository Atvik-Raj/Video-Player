<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Nexa PDF Viewer</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
    html, body {
        background-color: #120a08;
        color: #fff;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-panel {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ctrl-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        color: #f3f4f6;
        text-decoration: none;
    }
</style>
</head>
<body class="flex flex-col items-center h-screen px-3 py-3 select-none">

<!-- HEADER -->
<div id="top-header" class="flex items-center justify-between w-full max-w-3xl mb-2 px-1">
    <div class="flex items-center gap-2">
        <div class="w-9 h-9 bg-gradient-to-tr from-orange-500 to-red-500 rounded-xl flex items-center justify-center shadow">
            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div>
            <h1 class="text-xs font-bold tracking-wide">Nexa PDF Reader</h1>
            <p id="pdf-title" class="text-gray-400 text-[10px] truncate max-w-[200px]">Document Viewer</p>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <a id="download-btn" href="#" target="_blank" class="ctrl-btn bg-orange-500/20 border-orange-500/40 text-orange-300">⬇ Download</a>
        <button id="back-btn" class="ctrl-btn">← Back</button>
    </div>
</div>

<!-- PROXY VIEWER (100% CORS Bypass via Google Docs Viewer) -->
<div class="w-full max-w-3xl flex-1 glass-panel rounded-2xl overflow-hidden flex flex-col relative mb-2">
    <iframe id="pdf-frame" class="w-full h-full border-0 bg-white" allowfullscreen></iframe>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get('stream') || '';
    const fileName = params.get('name') || 'Document.pdf';

    document.getElementById('pdf-title').textContent = fileName;
    document.getElementById('download-btn').href = streamUrl;

    const iframe = document.getElementById('pdf-frame');
    if (streamUrl) {
        // Google Docs Viewer proxying prevents any CORS or Fetch failures completely!
        iframe.src = `https://docs.google.com/gview?url=${encodeURIComponent(streamUrl)}&embedded=true`;
    } else {
        iframe.srcdoc = "<h3 style='color:red; text-align:center; padding-top:20vh;'>Error: No PDF stream URL provided.</h3>";
    }

    document.getElementById('back-btn').onclick = () => {
        window.location.href = "index.html";
    };
</script>
</body>
</html>
