<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nexa Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Plyr (video player skin) -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<style>
    html, body { background-color: #120a08; color: #fff; height: 100%; margin: 0; }
    .glass-panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
    :root {
        --plyr-color-main: #f97316;
        --plyr-video-control-background-hover: #ea580c;
    }
    #pdf-frame { width: 100%; height: 78vh; border: 0; }
</style>
</head>
<body class="flex flex-col items-center min-h-screen">

<!-- HEADER -->
<div class="flex flex-col items-center mt-6 mb-4">
    <div class="w-16 h-16 bg-gradient-to-tr from-orange-500 to-red-500 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(249,115,22,0.5)] mb-2">
        <svg class="w-8 h-8 text-white translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <h1 class="text-xl font-bold tracking-wide">Nexa Player</h1>
    <p id="file-name" class="text-gray-400 text-xs mt-1 truncate max-w-xs"></p>
</div>

<!-- AD GATE -->
<div id="step-watch" class="w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-4 mx-4">
    <button id="watch-btn"
        class="bg-orange-500 hover:bg-red-600 text-white font-semibold py-3 px-8 rounded-xl transition-all shadow-[0_0_15px_rgba(249,115,22,0.6)] w-full">
        ▶ Watch Ad & Open Player
    </button>
    <p class="text-gray-500 text-xs text-center">Short ad dekhne ke baad player khul jaayega.</p>
</div>

<div id="step-loading" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3 mx-4">
    <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
    <p id="loading-text" class="text-gray-300 text-sm">Loading ad...</p>
</div>

<div id="step-error" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3 border border-red-500/30 mx-4">
    <p class="text-red-400 font-semibold text-center" id="error-text">Something went wrong.</p>
    <button id="retry-btn" class="bg-orange-500 text-white text-sm font-semibold py-2 px-6 rounded-xl">Try Again</button>
</div>

<!-- PLAYER -->
<div id="step-player" class="hidden w-full flex-1 flex flex-col items-center px-3 pb-6">
    <!-- 4a: Video player -->
    <video id="video-player" class="hidden w-full max-w-2xl rounded-xl" controls playsinline></video>

    <!-- 4b: PDF Frame (Yahan dusri pdf.html file load hogi) -->
    <iframe id="pdf-frame" class="hidden w-full max-w-2xl glass-panel rounded-2xl overflow-hidden"></iframe>

    <!-- 4c: Unsupported type fallback -->
    <div id="other-viewer" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-4">
        <p class="text-gray-300 text-sm text-center">Ye file type seedha preview nahi ho sakti.</p>
        <a id="other-download" href="#" target="_blank"
           class="bg-orange-500 text-white font-semibold py-2 px-6 rounded-xl">⬇ Download</a>
    </div>
</div>

<p class="text-gray-600 text-xs mt-auto mb-4">POWERED BY NEXA ENGINE · SECURE</p>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get('stream');
    const rawType   = (params.get('type') || '').toLowerCase();
    const fileName  = params.get('name') || 'File';

    const isPdf = rawType === 'pdf' || fileName.toLowerCase().endsWith('.pdf') || (streamUrl && streamUrl.toLowerCase().includes('.pdf'));
    const isVideo = rawType === 'video' || /\.(mp4|mkv|webm|mov)$/i.test(fileName);

    document.getElementById('file-name').textContent = fileName;

    const stepWatch = document.getElementById('step-watch');
    const stepLoading = document.getElementById('step-loading');
    const stepError = document.getElementById('step-error');
    const stepPlayer = document.getElementById('step-player');
    const loadingText = document.getElementById('loading-text');
    const errorText = document.getElementById('error-text');

    function showStep(step) {
        [stepWatch, stepLoading, stepError, stepPlayer].forEach(el => el.classList.add('hidden'));
        step.classList.remove('hidden');
    }
    function showError(msg) {
        errorText.textContent = msg;
        showStep(stepError);
    }

    function playAd(onDone) {
        showStep(stepLoading);
        let seconds = 10;
        loadingText.textContent = `Watching ad... ${seconds}s`;
        const timer = setInterval(() => {
            seconds -= 1;
            if (seconds <= 0) {
                clearInterval(timer);
                onDone();
            } else {
                loadingText.textContent = `Watching ad... ${seconds}s`;
            }
        }, 1000);
    }

    let plyrInstance = null;

    function openPlayer() {
        if (!streamUrl) return showError("Invalid link: file not specified.");
        showStep(stepPlayer);

        if (isVideo) {
            const v = document.getElementById('video-player');
            v.classList.remove('hidden');
            v.src = streamUrl;
            if (!plyrInstance) {
                plyrInstance = new Plyr(v, {
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                    settings: ['speed'],
                });
            }
            v.play().catch(() => {});
        } else if (isPdf) {
            // YAHAN SE DUSRI HTML FILE (pdf.html) LINK HO RAHI HAI:
            const pdfFrame = document.getElementById('pdf-frame');
            pdfFrame.classList.remove('hidden');
            pdfFrame.src = `pdf.html?stream=${encodeURIComponent(streamUrl)}&name=${encodeURIComponent(fileName)}`;

            // Note: Agar aapko box ke andar nahi balki poora naya page kholna ho, toh upar ki 3 line hata kar ye likh sakte ho:
            // window.location.href = `pdf.html?stream=${encodeURIComponent(streamUrl)}&name=${encodeURIComponent(fileName)}`;
        } else {
            document.getElementById('other-viewer').classList.remove('hidden');
            document.getElementById('other-download').href = streamUrl;
        }
    }

    document.getElementById('watch-btn').addEventListener('click', () => {
        if (!streamUrl) return showError("Invalid link: file not specified.");
        playAd(openPlayer);
    });
    document.getElementById('retry-btn').addEventListener('click', () => showStep(stepWatch));
</script>
</body>
</html>
