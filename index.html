<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================
     PART 1: HEAD / CONFIG
     ============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nexa Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Plyr (video player skin) -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<!-- PDF.js (Fixes blank PDF in Telegram WebView & enables custom modes) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
    html, body { background-color: #120a08; color: #fff; height: 100%; margin: 0; }
    .glass-panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
    .glass-btn { 
        background: rgba(18, 10, 8, 0.65); 
        backdrop-filter: blur(10px); 
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18); 
    }
    :root {
        --plyr-color-main: #f97316;
        --plyr-video-control-background-hover: #ea580c;
    }
    /* Custom scrollbar for Infinity Mode */
    #pdf-scroll-container::-webkit-scrollbar { width: 5px; }
    #pdf-scroll-container::-webkit-scrollbar-track { background: transparent; }
    #pdf-scroll-container::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.4); border-radius: 10px; }
    .pdf-page-canvas {
        width: 100%;
        height: auto;
        border-radius: 0.5rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        background-color: #1a110e;
    }
</style>
</head>
<body class="flex flex-col items-center min-h-screen select-none">

<!-- ============================================================
     PART 2: HEADER
     ============================================================ -->
<div class="flex flex-col items-center mt-5 mb-3">
    <div class="w-14 h-14 bg-gradient-to-tr from-orange-500 to-red-500 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(249,115,22,0.5)] mb-2">
        <svg class="w-7 h-7 text-white translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <h1 class="text-lg font-bold tracking-wide">Nexa Player</h1>
    <p id="file-name" class="text-gray-400 text-xs mt-0.5 truncate max-w-xs"></p>
</div>

<!-- ============================================================
     PART 3: AD GATE
     ============================================================ -->
<div id="step-watch" class="w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-4 mx-4 mt-4">
    <button id="watch-btn"
        class="bg-orange-500 hover:bg-red-600 text-white font-semibold py-3 px-8 rounded-xl transition-all shadow-[0_0_15px_rgba(249,115,22,0.6)] w-full">
        ▶ Watch Ad & Open Player
    </button>
    <p class="text-gray-500 text-xs text-center">Short ad dekhne ke baad player khul jaayega.</p>
</div>

<div id="step-loading" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3 mx-4 mt-4">
    <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
    <p id="loading-text" class="text-gray-300 text-sm">Loading ad...</p>
</div>

<div id="step-error" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3 border border-red-500/30 mx-4 mt-4">
    <p class="text-red-400 font-semibold text-center text-sm" id="error-text">Something went wrong.</p>
    <button id="retry-btn" class="bg-orange-500 text-white text-sm font-semibold py-2 px-6 rounded-xl">Try Again</button>
</div>

<!-- ============================================================
     PART 4: PLAYER
     ============================================================ -->
<div id="step-player" class="hidden w-full flex-1 flex flex-col items-center px-3 pb-4">

    <!-- 4a: Video player -->
    <video id="video-player" class="hidden w-full max-w-2xl rounded-xl" controls playsinline></video>

    <!-- 4b: Advanced PDF Viewer Box -->
    <div id="pdf-wrapper" class="hidden relative w-full max-w-2xl h-[75vh] glass-panel rounded-2xl overflow-hidden flex flex-col">
        
        <!-- Top-Right Transparent Mode Toggle Button & Page Counter Badge -->
        <div class="absolute top-3 right-3 z-20 flex items-center gap-2">
            <!-- Current Page Indicator -->
            <span id="pdf-page-indicator" class="glass-btn text-[11px] font-medium text-gray-200 px-2.5 py-1.5 rounded-lg shadow-lg">
                1 / 1
            </span>

            <!-- Mode Toggle Button (Infinity vs Page-by-Page) -->
            <button id="pdf-mode-btn" 
                class="glass-btn hover:bg-orange-500/30 active:scale-95 text-xs font-semibold text-white px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all shadow-lg">
                <span id="pdf-mode-icon" class="text-orange-400 text-sm leading-none">∞</span>
                <span id="pdf-mode-label">Infinity</span>
            </button>
        </div>

        <!-- PDF Loading Spinner Inside Box -->
        <div id="pdf-loader" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-[#120a08]/80 backdrop-blur-sm">
            <div class="w-9 h-9 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-2"></div>
            <p id="pdf-loader-text" class="text-xs text-gray-300">Loading PDF...</p>
        </div>

        <!-- Scrollable / Page Container -->
        <div id="pdf-scroll-container" class="w-full h-full overflow-y-auto p-3 pt-12 flex flex-col items-center gap-3 scroll-smooth">
            <!-- PDF canvases inject here -->
        </div>

        <!-- Bottom Floating Controls (Visible only in Page-by-Page Mode) -->
        <div id="pdf-page-controls" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 glass-btn px-4 py-2 rounded-xl shadow-xl">
            <button id="prev-page-btn" class="text-white hover:text-orange-400 disabled:opacity-30 text-sm font-bold px-2 py-0.5 transition">
                ◀ Prev
            </button>
            <div class="h-4 w-[1px] bg-white/15"></div>
            <button id="next-page-btn" class="text-white hover:text-orange-400 disabled:opacity-30 text-sm font-bold px-2 py-0.5 transition">
                Next ▶
            </button>
        </div>
    </div>

    <!-- 4c: Unsupported type fallback -->
    <div id="other-viewer" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-4">
        <p class="text-gray-300 text-sm text-center">Ye file type seedha preview nahi ho sakti.</p>
        <a id="other-download" href="#" target="_blank"
           class="bg-orange-500 text-white font-semibold py-2 px-6 rounded-xl">⬇ Download</a>
    </div>
</div>

<p class="text-gray-600 text-[11px] mt-auto mb-3 tracking-wider">POWERED BY NEXA ENGINE · SECURE</p>

<!-- ============================================================
     PART 5: LOGIC
     ============================================================ -->
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // PDF.js Worker Setup
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ---- URL params ----
    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get('stream');
    const mediaType = params.get('type');     // "video" | "pdf" | "other"
    const fileName  = params.get('name') || 'File';

    document.getElementById('file-name').textContent = fileName;

    const stepWatch = document.getElementById('step-watch');
    const stepLoading = document.getElementById('step-loading');
    const stepError = document.getElementById('step-error');
    const stepPlayer = document.getElementById('step-player');
    const loadingText = document.getElementById('loading-text');
    const errorText = document.getElementById('error-text');

    function showStep(step) {
        [stepWatch, stepLoading, stepError, stepPlayer].forEach(el => el.classList.add('hidden'));
        step.classList.remove('hidden');
    }
    function showError(msg) {
        errorText.textContent = msg;
        showStep(stepError);
    }

    // ---- PART 3: Ad Timer ----
    function playAd(onDone) {
        showStep(stepLoading);
        let seconds = 10;
        loadingText.textContent = `Watching ad... ${seconds}s`;
        const timer = setInterval(() => {
            seconds -= 1;
            if (seconds <= 0) {
                clearInterval(timer);
                onDone();
            } else {
                loadingText.textContent = `Watching ad... ${seconds}s`;
            }
        }, 1000);
    }

    // ---- PART 4: Player & Advanced PDF Engine ----
    let plyrInstance = null;
    let pdfDoc = null;
    let pdfMode = 'infinity'; // 'infinity' | 'page'
    let currentPage = 1;
    let totalPages = 0;
    let renderedPages = new Set();

    const pdfWrapper = document.getElementById('pdf-wrapper');
    const pdfContainer = document.getElementById('pdf-scroll-container');
    const pdfLoader = document.getElementById('pdf-loader');
    const pdfLoaderText = document.getElementById('pdf-loader-text');
    const pdfModeBtn = document.getElementById('pdf-mode-btn');
    const pdfModeIcon = document.getElementById('pdf-mode-icon');
    const pdfModeLabel = document.getElementById('pdf-mode-label');
    const pdfPageIndicator = document.getElementById('pdf-page-indicator');
    const pdfPageControls = document.getElementById('pdf-page-controls');
    const prevPageBtn = document.getElementById('prev-page-btn');
    const nextPageBtn = document.getElementById('next-page-btn');

    async function initPdfViewer(url) {
        pdfWrapper.classList.remove('hidden');
        pdfLoader.classList.remove('hidden');

        try {
            const loadingTask = pdfjsLib.getDocument(url);
            loadingTask.onProgress = (progressData) => {
                if (progressData.total > 0) {
                    const pct = Math.round((progressData.loaded / progressData.total) * 100);
                    pdfLoaderText.textContent = `Loading PDF... ${pct}%`;
                }
            };

            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            currentPage = 1;
            renderedPages.clear();
            pdfContainer.innerHTML = '';

            // Create placeholder canvases for all pages so scrolling is smooth
            for (let i = 1; i <= totalPages; i++) {
                const canvas = document.createElement('canvas');
                canvas.id = `pdf-page-${i}`;
                canvas.dataset.pageNumber = i;
                canvas.className = 'pdf-page-canvas';
                pdfContainer.appendChild(canvas);
            }

            pdfLoader.classList.add('hidden');
            applyPdfMode();
            setupLazyRenderObserver();
        } catch (err) {
            console.error('PDF load error:', err);
            pdfLoader.classList.add('hidden');
            // Fallback to direct download if CORS blocks canvas rendering
            pdfWrapper.classList.add('hidden');
            document.getElementById('other-viewer').classList.remove('hidden');
            document.getElementById('other-download').href = url;
        }
    }

    async function renderPage(pageNum) {
        if (renderedPages.has(pageNum) || !pdfDoc) return;
        renderedPages.add(pageNum);

        const page = await pdfDoc.getPage(pageNum);
        const canvas = document.getElementById(`pdf-page-${pageNum}`);
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        // High-DPI crisp rendering for mobile screens
        const dpr = window.devicePixelRatio || 1;
        const containerWidth = pdfContainer.clientWidth - 24;
        const unscaledViewport = page.getViewport({ scale: 1 });
        const scale = (containerWidth / unscaledViewport.width) * dpr;
        const viewport = page.getViewport({ scale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({ canvasContext: ctx, viewport }).promise;
    }

    function setupLazyRenderObserver() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const pageNum = parseInt(entry.target.dataset.pageNumber, 10);
                    renderPage(pageNum);
                    if (pdfMode === 'infinity') {
                        currentPage = pageNum;
                        updatePageIndicator();
                    }
                }
            });
        }, { root: pdfContainer, rootMargin: '300px 0px' });

        document.querySelectorAll('.pdf-page-canvas').forEach(c => observer.observe(c));
    }

    function applyPdfMode() {
        const canvases = document.querySelectorAll('.pdf-page-canvas');

        if (pdfMode === 'infinity') {
            pdfModeIcon.textContent = '∞';
            pdfModeLabel.textContent = 'Infinity';
            pdfPageControls.classList.add('hidden');
            pdfContainer.classList.add('overflow-y-auto');
            pdfContainer.classList.remove('overflow-hidden', 'justify-center');

            canvases.forEach(c => c.classList.remove('hidden'));

            // Scroll smoothly to current active page
            const target = document.getElementById(`pdf-page-${currentPage}`);
            if (target) target.scrollIntoView({ block: 'start' });
        } else {
            pdfModeIcon.textContent = '📄';
            pdfModeLabel.textContent = 'Page Mode';
            pdfPageControls.classList.remove('hidden');
            pdfContainer.scrollTop = 0;

            canvases.forEach((c, idx) => {
                if (idx + 1 === currentPage) {
                    c.classList.remove('hidden');
                } else {
                    c.classList.add('hidden');
                }
            });
            renderPage(currentPage);
            // Pre-render next page for instant page turns
            if (currentPage + 1 <= totalPages) renderPage(currentPage + 1);
        }
        updatePageIndicator();
    }

    function updatePageIndicator() {
        pdfPageIndicator.textContent = `${currentPage} / ${totalPages}`;
        prevPageBtn.disabled = currentPage <= 1;
        nextPageBtn.disabled = currentPage >= totalPages;
    }

    // Mode Toggle Button Click
    pdfModeBtn.addEventListener('click', () => {
        pdfMode = pdfMode === 'infinity' ? 'page' : 'infinity';
        applyPdfMode();
    });

    // Prev / Next Page Buttons in Page Mode
    prevPageBtn.addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            applyPdfMode();
        }
    });
    nextPageBtn.addEventListener('click', () => {
        if (currentPage < totalPages) {
            currentPage++;
            applyPdfMode();
        }
    });

    // Mobile Swipe Left/Right Support for Page Mode
    let touchStartX = 0;
    pdfContainer.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    pdfContainer.addEventListener('touchend', e => {
        if (pdfMode !== 'page') return;
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 50) {
            if (diff < 0 && currentPage < totalPages) {
                currentPage++;
                applyPdfMode();
            } else if (diff > 0 && currentPage > 1) {
                currentPage--;
                applyPdfMode();
            }
        }
    }, { passive: true });

    function openPlayer() {
        if (!streamUrl) return showError("Invalid link: file not specified.");
        showStep(stepPlayer);

        if (mediaType === 'video') {
            const v = document.getElementById('video-player');
            v.classList.remove('hidden');
            v.src = streamUrl;

            if (!plyrInstance) {
                plyrInstance = new Plyr(v, {
                    controls: [
                        'play-large', 'play', 'progress', 'current-time',
                        'mute', 'volume', 'settings', 'fullscreen'
                    ],
                    settings: ['speed'],
                });
            }
            v.play().catch(() => {});
        } else if (mediaType === 'pdf') {
            initPdfViewer(streamUrl);
        } else {
            document.getElementById('other-viewer').classList.remove('hidden');
            document.getElementById('other-download').href = streamUrl;
        }
    }

    // ---- Wire up buttons ----
    document.getElementById('watch-btn').addEventListener('click', () => {
        if (!streamUrl) return showError("Invalid link: file not specified.");
        playAd(openPlayer);
    });
    document.getElementById('retry-btn').addEventListener('click', () => showStep(stepWatch));
</script>
</body>
</html>
