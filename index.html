<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Mini Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid rgba(48, 54, 61, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 select-none">

    <div class="w-full max-w-md glass-card rounded-2xl p-6 shadow-2xl flex flex-col items-center text-center">
        <div id="media-badge" class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-2xl flex items-center justify-center shadow-lg mb-4">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"></path>
            </svg>
        </div>

        <h1 id="file-title" class="text-lg font-bold text-gray-100">Media Streamer</h1>
        <p id="file-subtitle" class="text-xs text-gray-400 mt-1 mb-5 break-all max-w-[280px]">Detecting format...</p>

        <!-- Video Player Section -->
        <div id="video-section" class="w-full hidden mb-4 rounded-xl overflow-hidden shadow-2xl bg-black border border-gray-800">
            <video id="player" controls playsinline class="w-full h-auto">
                <source id="video-source" src="" type="video/mp4">
            </video>
        </div>

        <!-- Document / Webpage Placeholder -->
        <div id="doc-section" class="w-full hidden flex-col items-center p-4 bg-gray-800/50 rounded-xl border border-gray-700/50 mb-4">
            <span id="doc-tag" class="text-xs font-semibold text-blue-400 mb-1">Document Ready</span>
            <p class="text-xs text-gray-300">Tap below to open file using Telegram's native viewer.</p>
        </div>

        <!-- Action Button -->
        <button id="action-btn" class="w-full py-3.5 px-6 rounded-xl font-bold text-sm text-white bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition-all shadow-lg flex items-center justify-center">
            <span>Open in Telegram Browser</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        let rawUrl = urlParams.get('v') || urlParams.get('file');

        const fileTitle = document.getElementById('file-title');
        const fileSubtitle = document.getElementById('file-subtitle');
        const videoSection = document.getElementById('video-section');
        const docSection = document.getElementById('doc-section');
        const docTag = document.getElementById('doc-tag');
        const player = document.getElementById('player');
        const videoSource = document.getElementById('video-source');
        const actionBtn = document.getElementById('action-btn');

        let mediaUrl = null;

        if (rawUrl) {
            mediaUrl = decodeURIComponent(rawUrl);
            const cleanUrl = mediaUrl.toLowerCase().split('?')[0];

            if (cleanUrl.endsWith('.mp4') || cleanUrl.endsWith('.mkv') || cleanUrl.endsWith('.webm')) {
                fileTitle.innerText = "Video Streaming";
                fileSubtitle.innerText = "Direct media stream available";
                actionBtn.innerText = "🌐 Open in Telegram Browser";
                videoSection.classList.remove('hidden');
                videoSource.src = mediaUrl;
                player.load();
            } else if (cleanUrl.endsWith('.pdf')) {
                fileTitle.innerText = "PDF Document";
                fileSubtitle.innerText = "Native in-app PDF render";
                docTag.innerText = "📄 PDF Document Detected";
                actionBtn.innerText = "⚡ Open PDF Instantly";
                docSection.classList.remove('hidden');
            } else {
                fileTitle.innerText = "Web Resource";
                fileSubtitle.innerText = "External file host page";
                docTag.innerText = "🔗 Web Page / Storage Link";
                actionBtn.innerText = "🌐 Open File Page";
                docSection.classList.remove('hidden');
            }
        }

        actionBtn.addEventListener('click', () => {
            if (!mediaUrl) return;
            if (tg.openLink) {
                tg.openLink(mediaUrl);
            } else {
                window.open(mediaUrl, '_blank');
            }
        });
    </script>
</body>
</html>
