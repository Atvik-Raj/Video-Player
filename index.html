<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexa Player</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ==================== AD SDK (yahan network ka SDK lagao) ====================
         AdsGram:  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
         TADS:     TADS tumhe apna widget/SDK snippet dashboard me dega, wahan se yahan paste karo.
         Jab tak koi SDK nahi laga, page ek "simulated" ad (timer) dikhayega taaki flow test ho sake.
    -->

    <style>
        body { background-color: #120a08; color: white; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <div class="flex flex-col items-center mb-8 mt-10">
        <div class="w-20 h-20 bg-gradient-to-tr from-orange-500 to-red-500 rounded-3xl flex items-center justify-center shadow-[0_0_20px_rgba(249,115,22,0.5)] mb-4">
            <svg class="w-10 h-10 text-white translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <h1 class="text-2xl font-bold tracking-wide">Nexa Player</h1>
        <p class="text-gray-400 text-sm mt-1" id="subtitle">Tap below to unlock your file</p>
    </div>

    <!-- Step 1: Watch Ad -->
    <div id="step-watch" class="w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-4">
        <button id="watch-btn"
            class="bg-orange-500 hover:bg-red-600 text-white font-semibold py-3 px-8 rounded-xl transition-all shadow-[0_0_15px_rgba(249,115,22,0.6)] w-full">
            ▶ Watch Ad & Unlock
        </button>
        <p class="text-gray-500 text-xs text-center">You'll watch a short ad, then your file will unlock automatically.</p>
    </div>

    <!-- Step 2: Ad playing / loading -->
    <div id="step-loading" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3">
        <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
        <p id="loading-text" class="text-gray-300 text-sm">Loading ad...</p>
    </div>

    <!-- Step 3: Unlocked -->
    <div id="step-done" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3 border border-green-500/30">
        <div class="text-3xl">✅</div>
        <p class="text-green-400 font-semibold">Verified! Opening your file...</p>
    </div>

    <!-- Step: Error -->
    <div id="step-error" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3 border border-red-500/30">
        <p class="text-red-400 font-semibold text-center" id="error-text">Something went wrong.</p>
        <button id="retry-btn" class="bg-orange-500 text-white text-sm font-semibold py-2 px-6 rounded-xl">Try Again</button>
    </div>

    <p class="text-gray-600 text-xs mt-10">POWERED BY NEXA ENGINE · SECURE</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // ==================== CONFIG ====================
        // Koyeb server ka base URL yahan daalo (jahan /miniverify route chalta hai).
        const KOYEB_BASE_URL = "https://rigid-sybila-smoak-9f8653b9.koyeb.app/";

        // URL params: ?bot=<bot_id>&file=<payload>
        const urlParams = new URLSearchParams(window.location.search);
        const botId = urlParams.get('bot');
        const filePayload = urlParams.get('file');

        const stepWatch = document.getElementById('step-watch');
        const stepLoading = document.getElementById('step-loading');
        const stepDone = document.getElementById('step-done');
        const stepError = document.getElementById('step-error');
        const loadingText = document.getElementById('loading-text');
        const errorText = document.getElementById('error-text');

        function showStep(step) {
            [stepWatch, stepLoading, stepDone, stepError].forEach(el => el.classList.add('hidden'));
            step.classList.remove('hidden');
        }

        function showError(msg) {
            errorText.textContent = msg;
            showStep(stepError);
        }

        // ==================== AD STEP ====================
        // Yahan asli ad SDK call hoga. Abhi ek simulated timer hai (testing ke liye).
        // AdsGram example:
        //   const AdController = window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" });
        //   AdController.show().then(onAdWatched).catch(() => showError("Ad failed. Please try again."));
        function playAd(onAdWatched) {
            showStep(stepLoading);
            let seconds = 10;
            loadingText.textContent = `Watching ad... ${seconds}s`;
            const timer = setInterval(() => {
                seconds -= 1;
                if (seconds <= 0) {
                    clearInterval(timer);
                    onAdWatched();
                } else {
                    loadingText.textContent = `Watching ad... ${seconds}s`;
                }
            }, 1000);
        }

        async function unlockAndRedirect() {
            loadingText.textContent = "Verifying...";
            try {
                const res = await fetch(`${KOYEB_BASE_URL}/miniverify`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        bot_id: botId,
                        init_data: tg.initData,
                        file: filePayload || undefined
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    showStep(stepDone);
                    if (data.pushed) {
                        // Bot ne seedha chat me "Get File" button bhej diya hai
                        document.querySelector('#step-done p').textContent =
                            "Verified! Check your chat for the file.";
                        setTimeout(() => tg.close(), 1200);
                    } else {
                        // Fallback: push nahi hua, to seedha redirect try karo
                        setTimeout(() => {
                            tg.openTelegramLink(data.deep_link);
                            tg.close();
                        }, 800);
                    }
                } else {
                    showError("Verification failed (" + (data.error || "unknown") + "). Please try again.");
                }
            } catch (e) {
                showError("Network error. Please check your connection and try again.");
            }
        }

        document.getElementById('watch-btn').addEventListener('click', () => {
            if (!botId) {
                return showError("Invalid link: bot not specified.");
            }
            if (!tg.initData) {
                return showError("Please open this from inside Telegram.");
            }
            playAd(unlockAndRedirect);
        });

        document.getElementById('retry-btn').addEventListener('click', () => {
            showStep(stepWatch);
        });
    </script>
</body>
</html>
