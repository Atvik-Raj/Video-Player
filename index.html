<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================
     PART 1: HEAD / CONFIG
     ============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nexa Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<!-- ==================== MONETAG SDK (Zone: 11850665) ==================== -->
<script src="//libtl.com/sdk.js" data-zone="11850665" data-sdk="show_11850665"></script>

<style>
    html, body { background-color: #120a08; color: #fff; height: 100%; margin: 0; }
    .glass-panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body class="flex flex-col items-center min-h-screen select-none">

<!-- ============================================================
     PART 2: HEADER
     ============================================================ -->
<div class="flex flex-col items-center mt-6 mb-4">
    <div class="w-16 h-16 bg-gradient-to-tr from-orange-500 to-red-500 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(249,115,22,0.5)] mb-2">
        <svg class="w-8 h-8 text-white translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <h1 class="text-xl font-bold tracking-wide">Nexa Player</h1>
    <p id="file-name" class="text-gray-400 text-xs mt-1 truncate max-w-xs"></p>
</div>

<!-- ============================================================
     PART 3: AD GATE
     ============================================================ -->
<div id="step-watch" class="w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-4 mx-4">
    <button id="watch-btn"
        class="bg-orange-500 hover:bg-red-600 text-white font-semibold py-3 px-8 rounded-xl transition-all shadow-[0_0_15px_rgba(249,115,22,0.6)] w-full">
        ▶ Watch Ad & Open Player
    </button>
    <p class="text-gray-500 text-xs text-center">Short ad dekhne ke baad player khul jaayega.</p>
</div>

<div id="step-loading" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3 mx-4">
    <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
    <p id="loading-text" class="text-gray-300 text-sm">Loading ad...</p>
</div>

<div id="step-error" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3 border border-red-500/30 mx-4">
    <p class="text-red-400 font-semibold text-center" id="error-text">Something went wrong.</p>
    <button id="retry-btn" class="bg-orange-500 text-white text-sm font-semibold py-2 px-6 rounded-xl">Try Again</button>
</div>

<!-- ============================================================
     PART 4: NATIVE PLAYER LAUNCHER (Ad ke baad turant khulega)
     ============================================================ -->
<div id="step-player" class="hidden w-full max-w-md glass-panel rounded-2xl p-6 flex flex-col items-center gap-3 mx-4">
    <p class="text-green-400 text-sm font-semibold text-center mb-1">✅ Ad Completed! Opening Native Player...</p>

    <!-- 1. Default Native Video Tag (Bina Plyr ke 100% Pure Native Browser Video) -->
    <video id="native-video" class="w-full rounded-xl bg-black mb-2" controls autoplay playsinline></video>

    <!-- 2. Direct System / External Native Player Buttons (Super Fast!) -->
    <button id="open-system-btn"
        class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 px-6 rounded-xl w-full text-sm shadow-lg">
        🚀 Open in Fast System Player
    </button>

    <div class="grid grid-cols-2 gap-2 w-full mt-1">
        <a id="vlc-btn" href="#"
           class="glass-panel hover:bg-white/10 text-center text-xs text-orange-300 font-semibold py-2.5 px-3 rounded-xl">
           🎬 Play in VLC
        </a>
        <a id="mx-btn" href="#"
           class="glass-panel hover:bg-white/10 text-center text-xs text-blue-300 font-semibold py-2.5 px-3 rounded-xl">
           ▶️ Play in MX Player
        </a>
    </div>
</div>

<p class="text-gray-600 text-xs mt-auto mb-4">POWERED BY NEXA ENGINE · SECURE</p>

<!-- ============================================================
     PART 5: LOGIC
     ============================================================ -->
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get('stream');
    const rawType   = (params.get('type') || '').toLowerCase();
    const fileName  = params.get('name') || 'File';
    // Optional: Agar bot se Telegram deep-link bhejo (?tgfile=https://t.me/Bot?start=file_123)
    const tgFileUrl = params.get('tgfile');

    const isPdf = rawType === 'pdf' || fileName.toLowerCase().endsWith('.pdf') || (streamUrl && streamUrl.toLowerCase().includes('.pdf'));

    document.getElementById('file-name').textContent = fileName;

    const stepWatch = document.getElementById('step-watch');
    const stepLoading = document.getElementById('step-loading');
    const stepError = document.getElementById('step-error');
    const stepPlayer = document.getElementById('step-player');
    const loadingText = document.getElementById('loading-text');
    const errorText = document.getElementById('error-text');

    function showStep(step) {
        [stepWatch, stepLoading, stepError, stepPlayer].forEach(el => el.classList.add('hidden'));
        step.classList.remove('hidden');
    }
    function showError(msg) {
        errorText.textContent = msg;
        showStep(stepError);
    }

    // ---- MONETAG AD (Zone: 11850665) ----
    function playAd(onDone) {
        showStep(stepLoading);
        if (typeof show_11850665 === 'function') {
            loadingText.textContent = "Loading ad...";
            show_11850665().then(() => {
                onDone();
            }).catch(() => {
                onDone();
            });
        } else {
            let seconds = 5;
            loadingText.textContent = `Watching ad... ${seconds}s`;
            const timer = setInterval(() => {
                seconds -= 1;
                if (seconds <= 0) {
                    clearInterval(timer);
                    onDone();
                } else {
                    loadingText.textContent = `Watching ad... ${seconds}s`;
                }
            }, 1000);
        }
    }

    function openPlayer() {
        if (!streamUrl && !tgFileUrl) return showError("Invalid link: file not specified.");

        // 1. Agar PDF hai toh pdf.html kholo
        if (isPdf) {
            window.location.href = `pdf.html?stream=${encodeURIComponent(streamUrl)}&name=${encodeURIComponent(fileName)}`;
            return;
        }

        // 2. Agar Bot ne Telegram Chat Native Link (tgfile) bheja hai, toh seedha Telegram Chat me video khol do!
        if (tgFileUrl) {
            tg.openTelegramLink(tgFileUrl);
            tg.close();
            return;
        }

        // 3. Warna Pure Native Video Player + External App Intent chala do (Bina Plyr ke!)
        showStep(stepPlayer);

        const nativeVideo = document.getElementById('native-video');
        nativeVideo.src = streamUrl;
        nativeVideo.play().catch(() => {});

        // Setup VLC & MX Player Native Intents for Android/iOS
        const cleanUrl = streamUrl.replace(/^https?:\/\//i, '');
        document.getElementById('vlc-btn').href = `vlc://${streamUrl}`;
        document.getElementById('mx-btn').href = `intent:${ cleanUrl }#Intent;package=com.mxtech.videoplayer.ad;S.title=${encodeURIComponent(fileName)};end`;

        // Open directly in System Native Browser/Video Player
        document.getElementById('open-system-btn').onclick = () => {
            if (tg && tg.openLink) {
                tg.openLink(streamUrl);
            } else {
                window.open(streamUrl, '_blank');
            }
        };
    }

    document.getElementById('watch-btn').addEventListener('click', () => {
        if (!streamUrl && !tgFileUrl) return showError("Invalid link: file not specified.");
        playAd(openPlayer);
    });
    document.getElementById('retry-btn').addEventListener('click', () => showStep(stepWatch));
</script>
</body>
</html>
