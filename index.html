<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS (For Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        body { background-color: #0f111a; color: white; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <!-- VIP Banner -->
    <div class="w-full max-w-md bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl p-3 flex justify-between items-center mb-8 shadow-lg">
        <div class="text-xs font-semibold">
            ⚡ NEW: Pay via UPI & Go 100% Ad-Free!
        </div>
        <button class="bg-white text-purple-700 text-xs font-bold py-1 px-3 rounded-full">
            Get VIP ➔
        </button>
    </div>

    <!-- Player Icon & Title -->
    <div class="flex flex-col items-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-tr from-purple-500 to-blue-500 rounded-3xl flex items-center justify-center shadow-[0_0_20px_rgba(168,85,247,0.4)] mb-4">
            <svg class="w-10 h-10 text-white translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <h1 class="text-2xl font-bold tracking-wide">Pro Player</h1>
        <p class="text-gray-400 text-sm mt-1">Tap play to stream securely</p>
    </div>

    <!-- Video Link Input Area -->
    <div id="input-container" class="w-full max-w-md glass-panel rounded-2xl p-2 flex items-center mb-6">
        <input type="text" id="video-url-display" readonly value="Loading secure link..." 
               class="bg-transparent border-none outline-none text-gray-300 text-sm w-full px-3 truncate">
        
        <!-- Play Button -->
        <button id="play-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded-xl transition-all shadow-[0_0_15px_rgba(59,130,246,0.5)]">
            ▶ Play
        </button>
    </div>

    <!-- Video Player Container (Hidden initially) -->
    <div id="video-container" class="w-full max-w-md hidden rounded-xl overflow-hidden shadow-2xl">
        <video id="main-video" controls class="w-full h-auto bg-black">
            <source id="video-source" src="" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

    <script>
        // 1. Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // 2. Extract Video Link from URL (?v=...)
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('v');
        
        const urlDisplay = document.getElementById('video-url-display');
        if (videoUrl) {
            urlDisplay.value = decodeURIComponent(videoUrl); 
        } else {
            urlDisplay.value = "No video link provided!";
        }

        // 3. Initialize AdsGram with numeric placeholder to prevent blockId error
        let AdController = null;
        try {
            AdController = window.Adsgram.init({ blockId: "1234" });
        } catch (e) {
            console.log("Adsgram init skipped/failed:", e);
        }

        // 4. Play Button Action
        document.getElementById('play-btn').addEventListener('click', () => {
            if (!videoUrl) return alert("Video link missing!");

            // Attempt ad show if available, otherwise direct play
            if (AdController) {
                AdController.show().then(() => {
                    startVideo();
                }).catch((err) => {
                    console.log("Ad bypassed/error:", err);
                    startVideo();
                });
            } else {
                startVideo();
            }
        });

        function startVideo() {
            document.getElementById('input-container').classList.add('hidden');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('main-video');
            const source = document.getElementById('video-source');
            
            videoContainer.classList.remove('hidden');
            source.src = decodeURIComponent(videoUrl);
            video.load();
            video.play();
        }
    </script>
</body>
</html>
